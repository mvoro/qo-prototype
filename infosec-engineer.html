<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Создание автоотклика — QuickOffer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" />
<style>

:root {
  color-scheme: light;
  --proto-bg: #14161f;
  --proto-surface: #1f2230;
  --proto-line: #2e3244;
  --proto-ink: #f3f4f8;
  --proto-muted: #9aa0b4;
  --proto-accent: #aeef2c;
  --proto-stage: #e9ebf2;
  --error: #eb2323;
  --error-hover: #b61919;
  --error-light: #f24d4d;
  --bg-error-light: #ffeded;
  --warning: #eb9b23;
  --warning-light: #f6af4d;
  --primary: #2341eb;
  --primary-hover: #1530c9;
  --primary-light: #4f66ef;
  --primary-lighter: #7b8cf3;
  --primary-soft: #9da9ff;
  --primary-pale: #cbd3ff;
  --cta-purple: #8323eb;
  --pink: #eb23e1;
  --success: #0ac900;
  --success-text: #3a7300;
  --lime-text: #688f1a;
  --secondary: #aeef2c;
  --secondary-light: #ebfbca;
  --bg-primary-light: #e5e9ff;
  --bg-primary-light-hover: #dbdff8;
  --text-on-dark-primary: #fff;
  --bg-secondary: #f8f9fa;
  --bg-secondary-hover: #f2f2f2;
  --bg-tertiary: #eef0f5;
  --border-primary: #dee2e8;
  --text-secondary: #bdc3c7;
  --text-on-dark-secondary: #ababab;
  --text-gray: #636b74;
  --text-dark-gray: #343a40;
  --text-primary-hover: #242732;
  --text-primary: #090c17;
  --text-primary-opacity-50: rgb(9, 12, 23, 0.5);
  --text-primary-opacity-25: rgb(9, 12, 23, 0.25);
  --bg-tint-blue: #e9ecfc;
  --bg-tint-pink: #ffedfc;
  --bg-tint-lime: #edffcc;
  --bg-warning-light: #fff7ed;
  --glow-lavender: #cfd2ff;
  --secondary-radial-gradient: radial-gradient(110.75% 118.48% at 87.76% 10.2%, #f2ffb1 0%, #d9f989 45%, #aeef2c 65.88%, #f2ffb1 100%);
  --light-primary-radial-gradient: radial-gradient(123.02% 97.95% at 63.32% 26.25%, #f5f7ff 0%, #e4e8ff 40%, #c9d0ff 100%);
  --purple-linear: linear-gradient(90.77deg, rgb(35, 65, 235, 0.08) 0%, rgb(235, 35, 225, 0.08) 100%);
  --purple-linear-strong: linear-gradient(91deg, #2341eb 0.21%, #eb23e1 99.79%);
  --db-section-shadow: 0 0 24px 0 color-mix(in srgb, var(--text-secondary) 20%, transparent);
  --fab-shadow: 0 0 24px color-mix(in srgb, var(--text-primary) 2.5%, transparent);
  --font-size: 16px;
  --font-size-xl: 20px;
  --br-xxs: 4px;
  --br-xs: 6px;
  --br-s: 8px;
  --br-m: 12px;
  --br-l: 16px;
  --br-xl: 24px;
  --br-xxl: 32px;
  --db-navbar-height: 56px;
  --db-sidebar-width: 264px;
  --db-bottom-bar-inset: 0px;
  --input-height: 42px;
  --input-height-l: 52px;
  --chat-option-height: 62px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html,
body {
  height: 100%;
}
[hidden] {
  display: none !important;
}
body {
  background: var(--proto-bg);
  color: var(--proto-ink);
  font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 14px;
  overflow: hidden;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button:disabled {
  cursor: default;
}
.proto {
  height: 100%;
  display: grid;
  grid-template-rows: 1fr;
}
.proto-stage {
  position: relative;
  min-height: 0;
  display: grid;
  place-items: center;
  background: var(--proto-stage);
  overflow: hidden;
}
.device-slot {
  position: relative;
  width: calc(var(--device-w) * var(--device-scale));
  height: calc(var(--device-h) * var(--device-scale));
}
.device {
  position: absolute;
  top: 0;
  left: 0;
  width: var(--device-w);
  height: var(--device-h);
  background: var(--text-on-dark-primary);
  transform: scale(var(--device-scale));
  transform-origin: top left;
  overflow: hidden;
}
.app {
  container: app / size;
  position: relative;
  width: 100%;
  height: 100%;
}
.app-root {
  position: relative;
  width: 100%;
  height: 100%;
  color: var(--text-primary);
  font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: var(--font-size);
  line-height: 1.3;
  background: var(--text-on-dark-primary);
  overflow: hidden;
}
.app-root * {
  outline-color: var(--primary);
}
.app-root :is(a, button, select, label[for], summary) {
  cursor: pointer;
}
.app-root h2 {
  font-size: 32px;
  font-weight: 500;
}
.app-root h3 {
  font-size: 24px;
  font-weight: 500;
}
.app-root h4 {
  font-size: 20px;
  font-weight: 500;
}
.app-root h5 {
  font-size: 18px;
  font-weight: 400;
}
.app-root :is(h2, h3, h4, h5) {
  text-wrap-style: balance;
}
.app-root svg {
  flex-shrink: 0;
}
.app-root ::selection {
  background: var(--primary-pale);
}
.scrollbar-thin {
  scrollbar-width: thin;
  scrollbar-color: var(--bg-tertiary) transparent;
}
.btn {
  position: relative;
  flex-shrink: 0;
  height: 42px;
  padding: 0 16px;
  display: inline-grid;
  grid-auto-flow: column;
  grid-auto-columns: auto;
  justify-content: center;
  align-items: center;
  gap: 0.5em;
  font-family: Manrope, sans-serif;
  font-size: 1em;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  text-decoration: none;
  background: var(--primary);
  color: var(--bg-secondary);
  border: none;
  border-radius: var(--br-m);
  overflow: hidden;
  transition:
    background-color 150ms ease-out,
    color 150ms ease-out,
    opacity 150ms ease-out,
    transform 160ms var(--ease-out);
}
.btn:not(:disabled):active {
  transform: scale(0.97);
}
.btn:hover {
  background: var(--primary-hover);
}
.btn:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.btn.s {
  height: 36px;
  font-size: 0.875em;
}
.btn.l {
  height: 52px;
  padding: 0 28px;
  font-size: 1.25em;
  border-radius: var(--br-l);
}
.btn.icon {
  aspect-ratio: 1;
  padding: 0;
}
.btn.full {
  width: 100%;
}
.btn.start {
  justify-content: flex-start;
}
.btn.shine::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(120deg, transparent, color-mix(in srgb, var(--text-on-dark-primary) 25%, transparent), transparent);
  pointer-events: none;
  animation: btn-shine 2.25s ease-in-out infinite;
}
@keyframes btn-shine {
  0% {
    left: -100%;
  }
  33%,
  100% {
    left: 100%;
  }
}
.btn.light {
  background: var(--bg-secondary);
  color: var(--text-primary);
}
.btn.light:hover {
  background: var(--bg-secondary-hover);
}
.btn.white {
  background: var(--text-on-dark-primary);
  color: var(--text-primary);
}
.btn.white:hover {
  background: var(--bg-secondary-hover);
}
.btn.primaryLight {
  background: var(--bg-primary-light);
  color: var(--primary);
}
.btn.primaryLight:hover {
  background: var(--bg-primary-light-hover);
}
.btn.whitePrimary {
  background: var(--text-on-dark-primary);
  color: var(--primary);
}
.btn.whitePrimary:hover {
  background: var(--bg-secondary-hover);
}
.btn.secondary {
  background: var(--secondary-radial-gradient);
  color: var(--text-primary);
}
.btn.secondary:hover {
  background: var(--secondary-radial-gradient);
  opacity: 0.85;
}
.btn.danger {
  background: var(--error);
}
.btn.danger:hover {
  background: var(--error-hover);
}
.btn.unstyled {
  padding: 0;
  height: auto;
  background: none;
  color: var(--primary);
  border-radius: var(--br-xs);
}
.btn.unstyled:hover {
  background: none;
  color: var(--primary-hover);
}
.btn.unstyledDark {
  padding: 0;
  height: auto;
  background: none;
  color: var(--text-primary);
  border-radius: var(--br-xs);
}
.btn.unstyledDark:hover {
  background: none;
  color: var(--text-gray);
}
.btn.unstyledSecondary {
  background: none;
  color: var(--text-gray);
}
.btn.unstyledSecondary:hover {
  background: none;
  color: var(--text-primary);
}
.btn:disabled,
.btn:disabled:hover {
  background: var(--text-secondary);
  color: var(--bg-secondary);
}
.btn.unstyled:disabled,
.btn.unstyled:disabled:hover {
  background: none;
  color: var(--text-secondary);
}
.btn.white svg,
.btn.light svg {
  font-size: 1.125em;
}
.badge {
  width: auto;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 0.325em;
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  text-decoration: none;
  color: var(--text-primary);
  background: var(--bg-secondary-hover);
  border: 0;
  border-radius: var(--br-s);
}
.badge.round {
  border-radius: 50px;
}
.badge.l {
  height: 34px;
  padding: 0 1em;
}
.badge.s {
  height: 20px;
  padding: 0 0.75em;
  font-size: 10px;
  border-radius: var(--br-xs);
}
.badge.white {
  background: var(--text-on-dark-primary);
}
.badge.lightPrimary {
  color: var(--primary);
  background: var(--bg-primary-light);
}
.badge.success {
  color: var(--lime-text);
  background: var(--bg-tint-lime);
}
.badge.dangerLight {
  color: var(--error);
  background: var(--bg-error-light);
}
.badge.warningLight {
  color: var(--warning);
  background: var(--bg-warning-light);
}
.badge.primaryPinkGradient {
  color: var(--primary);
  background: var(--purple-linear);
}
.badge.secondaryLight {
  background: var(--secondary-light);
}
.indicator {
  position: relative;
  width: 10px;
  height: 10px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--text-secondary);
}
.indicator.success {
  background: var(--success);
}
.indicator.warning {
  background: var(--warning);
}
.indicator.error {
  background: var(--error);
}
.indicator.primary {
  background: var(--primary);
}
.indicator.s12 {
  width: 12px;
  height: 12px;
}
.indicator.pulse {
  animation: indicator-pulse 1.33s ease-in-out infinite;
}
@keyframes indicator-pulse {
  50% {
    filter: brightness(1.35) saturate(0.7);
  }
}
.field {
  display: flex;
  flex-direction: column;
  gap: 0.5em;
}
.field-label {
  margin-left: 1em;
  font-family: Manrope, sans-serif;
  font-size: 18px;
  font-weight: 600;
  line-height: 1;
}
.field-hint {
  font-family: Manrope, sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
}
.input {
  width: 100%;
  height: var(--input-height);
  padding: 0 1em;
  font-family: Manrope, sans-serif;
  font-size: 1em;
  font-weight: 600;
  color: var(--text-primary);
  background: var(--bg-secondary);
  border: 1px solid transparent;
  border-radius: var(--br-m);
  transition: 0.15s;
}
.input::placeholder {
  color: var(--text-secondary);
}
.input:focus-visible {
  outline: none;
  border-color: var(--primary);
}
.input.white {
  background: var(--text-on-dark-primary);
}
.toggle {
  position: relative;
  flex-shrink: 0;
  width: 40px;
  height: 24px;
  display: inline-block;
}
.toggle input {
  position: absolute;
  width: 0;
  height: 0;
  opacity: 0;
}
.toggle-slider {
  position: absolute;
  inset: 0;
  background: var(--text-secondary);
  border-radius: 30px;
  cursor: pointer;
  transition: background-color 200ms ease-out;
}
.toggle-slider::before {
  content: '';
  position: absolute;
  left: 2px;
  bottom: 2px;
  height: 20px;
  aspect-ratio: 1;
  background: var(--text-on-dark-primary);
  border-radius: 20px;
  transition: transform 150ms var(--ease-out);
}
.toggle input:checked + .toggle-slider {
  background: var(--primary);
}
.toggle input:checked + .toggle-slider::before {
  transform: translateX(16px);
}
.toggle input:focus-visible + .toggle-slider {
  outline: 2px solid var(--primary);
  outline-offset: 4px;
}
.check {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
}
.check input {
  position: absolute;
  width: 0;
  height: 0;
  opacity: 0;
}
.check-mark {
  position: relative;
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  background: var(--bg-secondary);
  border: 1px solid var(--bg-secondary-hover);
  border-radius: var(--br-xs);
  transition:
    background-color 150ms ease-out,
    border-color 150ms ease-out;
}
.check-mark.light {
  background: var(--text-on-dark-primary);
}
.check-mark::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 45%;
  width: 4px;
  height: 7px;
  border: solid var(--text-on-dark-primary);
  border-width: 0 0.15em 0.15em 0;
  opacity: 0;
  transform: translate(-50%, -50%) rotate(45deg) scale(0);
  transition:
    opacity 150ms var(--ease-out),
    transform 150ms var(--ease-out);
}
.check input:checked ~ .check-mark {
  background: var(--primary);
  border-color: var(--primary);
}
.check input:checked ~ .check-mark::after {
  opacity: 1;
  transform: translate(-50%, -50%) rotate(45deg) scale(1);
}
.check input:focus-visible ~ .check-mark {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.alert {
  flex-shrink: 0;
  padding: 0.75em 1.25em;
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: start;
  gap: 0.5em;
  font-family: Manrope, sans-serif;
  font-weight: 600;
  line-height: 1.35;
  color: var(--text-primary);
  background: var(--bg-secondary);
  border-radius: var(--br-l);
}
.alert > svg {
  margin-top: 0.08em;
  font-size: 1.2em;
}
.alert.s {
  padding: 0.75em 1em;
  gap: 0.375em;
  font-size: 0.875em;
  border-radius: var(--br-m);
}
.alert.s > svg {
  font-size: 1.1em;
}
.alert.warning {
  color: var(--warning);
  background: var(--bg-warning-light);
}
.alert.error {
  color: var(--error);
  background: var(--bg-error-light);
}
.alert.success {
  color: var(--success-text);
  background: var(--secondary-light);
}
.alert.lightPrimary {
  color: var(--primary-light);
  background: var(--bg-primary-light);
}
.alert.white {
  background: var(--text-on-dark-primary);
}
.alert b {
  font-weight: 700;
  color: inherit;
}
.overlay {
  position: absolute;
  inset: 0;
  z-index: 99;
  background: var(--text-primary-opacity-25);
  animation: overlay-in 200ms var(--ease-out);
}
@keyframes overlay-in {
  from {
    opacity: 0;
  }
}
.modal {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 600px;
  max-width: calc(100% - 32px);
  max-height: 95%;
  padding: 1.5em;
  display: flex;
  flex-direction: column;
  gap: 1em;
  background: var(--text-on-dark-primary);
  border-radius: var(--br-xl);
  overflow: hidden auto;
  transform: translate(-50%, -50%);
  animation: modal-in 200ms var(--ease-out);
}
.modal.xs {
  width: 480px;
}
.modal.m {
  width: 740px;
}
@keyframes modal-in {
  from {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.96);
  }
}
.modal-header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.modal-header h3 {
  font-size: 24px;
  font-weight: 500;
}
.modal-close {
  margin: -8px -8px 0 0;
}
.modal-close svg {
  font-size: 24px;
}
.modal-subtitle {
  margin-top: -8px;
  font-family: Manrope, sans-serif;
  font-weight: 500;
  color: var(--text-gray);
}
.modal-actions {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 8px;
}
.menu-anchor {
  position: relative;
  display: flex;
}
.menu {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  z-index: 20;
  min-width: 220px;
  padding: 0.5em;
  display: grid;
  background: var(--text-on-dark-primary);
  border: 1px solid var(--bg-tertiary);
  border-radius: var(--br-m);
  box-shadow: 0 0 24px rgb(175, 184, 190, 0.1);
  animation: menu-in 150ms var(--ease-out);
  transform-origin: top right;
}
.menu.up {
  top: auto;
  bottom: calc(100% + 6px);
  transform-origin: bottom right;
}
@keyframes menu-in {
  from {
    opacity: 0;
    transform: scale(0.97);
  }
}
.menu-item {
  width: 100%;
  height: 42px;
  padding: 0 16px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 0.5em;
  font-family: Manrope, sans-serif;
  font-size: 1em;
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
  color: var(--text-primary);
  background: var(--text-on-dark-primary);
  border: 0;
  border-radius: var(--br-m);
  transition: background-color 150ms ease-out;
}
.menu-item + .menu-item {
  margin-top: 4px;
}
.menu-item:hover {
  background: var(--bg-secondary-hover);
}
.menu-item:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: -2px;
}
.menu-item svg {
  font-size: 1.125em;
}
.sheet-items {
  display: grid;
  gap: 8px;
}
.toasts {
  position: absolute;
  right: 16px;
  bottom: 16px;
  z-index: 120;
  width: 340px;
  max-width: calc(100% - 32px);
  display: flex;
  flex-direction: column;
  gap: 12px;
  pointer-events: none;
}
.toast {
  min-height: 64px;
  padding: 14px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  font-size: 16px;
  line-height: 1.35;
  color: #757575;
  background: #fff;
  border-radius: 6px;
  box-shadow: 0 4px 12px rgb(0, 0, 0, 0.1);
  pointer-events: auto;
  animation: toast-in 320ms var(--ease-out);
}
.toast.leaving {
  animation: toast-out 220ms ease-in forwards;
}
@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateX(24px);
  }
}
@keyframes toast-out {
  to {
    opacity: 0;
    transform: translateX(24px);
  }
}
.toast > svg {
  font-size: 20px;
}
.toast.success > svg {
  color: #07bc0c;
}
.toast.info > svg {
  color: #3498db;
}
.toast.warning > svg {
  color: #f1c40f;
}
.toast-undo {
  padding: 4px 8px;
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--primary);
  background: none;
  border: 0;
  border-radius: var(--br-xs);
}
.toast-undo:hover {
  background: var(--bg-primary-light);
}
.ai-label {
  font-family: Manrope, sans-serif;
  font-weight: 600;
  background: linear-gradient(90deg, var(--primary) 0%, var(--pink) 100%);
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.ai-spinner {
  width: 1em;
  height: 1em;
  flex-shrink: 0;
  animation: ai-spin 1.6s ease-in-out infinite;
}
@keyframes ai-spin {
  0%,
  100% {
    transform: scale(1) rotate(0deg);
    opacity: 1;
  }
  50% {
    transform: scale(0.82) rotate(18deg);
    opacity: 0.7;
  }
}
.logo-box {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  font-family: Manrope, sans-serif;

    display: none;
  }
  .click-chat-mobile {
    position: relative;
    order: -1;
    display: flex;
  }
  .feed-banner {
    padding: 14px;
    grid-template-columns: 1fr;
  }
}
.flow {
  height: var(--db-page-height);
  min-height: 0;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 1.25em;
}
.flow.is-manual {
  grid-template-rows: auto 1fr auto;
  gap: 12px;
}
.page-header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 16px;
}
.page-header h2 {
  min-width: 0;
  font-size: 24px;
  font-weight: 600;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
}
.mode {
  width: 332px;
  padding: 6px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  background: var(--text-on-dark-primary);
  border-radius: var(--br-l);
}
.mode .btn svg {
  font-size: 18px;
}
.chat {
  width: 100%;
  max-width: 720px;
  min-height: 0;
  margin: 0 auto;
  display: grid;
  grid-template-rows: 1fr auto;
  overflow: hidden;
}
.chat-messages {
  position: relative;
  min-height: 0;
  padding: 8px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
  scrollbar-width: none;
}
.chat-messages::-webkit-scrollbar {
  display: none;
}
.msg {
  width: 100%;
  display: flex;
  animation: msg-in 0.25s ease-out both;
}
@keyframes msg-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}
.msg.static {
  animation: none;
}
.msg.user {
  justify-content: flex-end;
}
.msg-content {
  max-width: 85%;
}
.bubble {
  padding: 12px 16px;
  display: grid;
  gap: 10px;
  font-size: var(--font-size);
  font-weight: 500;
  line-height: 1.5;
  overflow-wrap: anywhere;
  border-radius: var(--br-l);
}
.msg.user .bubble {
  background: var(--bg-primary-light);
  border-bottom-right-radius: var(--br-xxs);
}
.msg.assistant .bubble {
  background: var(--text-on-dark-primary);
  border-bottom-left-radius: var(--br-xxs);
}
.bubble b {
  font-weight: 600;
}
.bubble-loading {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
}
.msg.summary .msg-content {
  width: 100%;
}
.bubble-lead {
  font-size: 18px;
  font-weight: 500;
  line-height: 1.4;
}
.ptable {
  background: var(--bg-secondary);
  border-radius: var(--br-l);
  overflow: hidden;
}
.ptable-row {
  padding: 16px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: start;
  gap: 8px 16px;
}
.ptable-row + .ptable-row {
  border-top: 1px solid var(--bg-tertiary);
}
.ptable-label {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.5;
  color: var(--text-gray);
}
.ptable-value {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
  text-align: right;
  overflow-wrap: anywhere;
}
.ptable-value .badge {
  height: auto;
  min-height: 28px;
  padding-block: 3px;
  white-space: normal;
  text-align: left;
}
.ptable-row.is-removed .ptable-value .badge {
  color: var(--text-gray);
  text-decoration: line-through;
  background: var(--bg-secondary-hover);
}
.ptable-row.is-stack {
  grid-template-columns: minmax(0, 1fr);
}
.ptable-rules {
  display: grid;
  gap: 8px;
  list-style: none;
}
.ptable-rules li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: 8px;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.4;
}
.ptable-rules li > svg {
  margin-top: 0.15em;
  font-size: 1.05em;
  color: var(--cta-purple);
}
.ptable-rules li .badge {
  margin-top: 0.1em;
}
.ptable-rules li.is-removed span:not(.badge),
.ptable-rules li.is-off span:not(.badge) {
  color: var(--text-gray);
}
.ptable-rules li.is-removed span:not(.badge) {
  text-decoration: line-through;
}
.ptable-rules li.is-removed > svg,
.ptable-rules li.is-off > svg {
  color: var(--text-secondary);
}
.ptable-row.is-total {
  grid-template-columns: minmax(0, 1fr) auto;
  row-gap: 2px;
}
.ptable-row.is-total strong {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--text-primary);
}
.ptable-note {
  grid-column: 1 / -1;
  font-family: Manrope, sans-serif;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--text-gray);
}
.msg.summary:not(.open) .is-same,
.msg.summary:not(.open) .only-open,
.msg.summary.open .only-closed {
  display: none;
}
.summary-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.summary-actions .btn {
  border: 1px solid var(--bg-tertiary);
}
.summary-actions .btn svg {
  font-size: 1.2em;
}
.summary-toggle svg {
  transition: transform 200ms var(--ease-out);
}
.msg.summary.open .summary-toggle svg {
  transform: rotate(180deg);
}
.msg.summary:not(.latest) [data-act='preview'],
.msg.summary:not(.latest) .summary-actions:not(:has(.summary-toggle)) {
  display: none;
}
.diag {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.diag-row {
  min-height: var(--chat-option-height);
  padding: 0 20px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 12px;
  font-family: Manrope, sans-serif;
  font-weight: 600;
  background: var(--bg-secondary);
  border-radius: var(--br-l);
}
.diag-label {
  color: var(--text-gray);
  overflow-wrap: anywhere;
}
.diag-impact {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--error);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.diag-impact svg {
  font-size: 0.75em;
}
.chat-input {
  transition: opacity 0.2s ease;
}
.chat-input.busy {
  opacity: 0.5;
  pointer-events: none;
}
.textbox {
  position: relative;
  width: 100%;
  min-height: 96px;
  display: flex;
  background: var(--text-on-dark-primary);
  border: 1px solid var(--bg-secondary-hover);
  border-radius: var(--br-l);
  transition: border-color 150ms ease-out;
}
.textbox:focus-within {
  border-color: var(--primary-pale);
}
.textbox textarea {
  flex: 1;
  width: 100%;
  padding: 16px 60px 16px 16px;
  font-family: Manrope, sans-serif;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--text-primary);
  background: transparent;
  border: none;
  border-radius: var(--br-l);
  outline: none;
  resize: none;
}
.textbox.has-skip textarea {
  padding-right: 148px;
}
.textbox textarea::placeholder {
  color: var(--text-secondary);
}
.textbox .btn {
  position: absolute;
  right: 8px;
  bottom: 8px;
}
.textbox.compact {
  min-height: 0;
}
.textbox.compact textarea {
  padding: 12px 56px 12px 14px;
  font-size: 15px;
}
.answer {
  width: 100%;
  display: flex;
  flex-direction: column;
  background: var(--text-on-dark-primary);
  border: 1px solid var(--bg-secondary-hover);
  border-radius: var(--br-l);
}
.answer-head {
  min-height: 60px;
  padding: 12px 24px 6px;
  display: grid;
  grid-template-columns: 1fr;
  align-items: center;
  gap: 16px;
}
.answer-head:has(.answer-action:not(:empty)) {
  grid-template-columns: 1fr minmax(132px, auto);
  padding-right: 12px;
}
.answer-title {
  font-size: 18px;
  font-weight: 500;
  color: var(--text-primary);
}
.answer-action {
  display: flex;
  align-items: center;
  justify-content: flex-end;
}
.answer-action:empty {
  display: none;
}
.answer-body {
  padding: 0 12px 12px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}
.opt {
  width: 100%;
  min-height: var(--chat-option-height);
  padding: 0;
  flex-shrink: 0;
  display: flex;
  font: inherit;
  text-align: left;
  background: var(--text-on-dark-primary);
  border: none;
  border-radius: var(--br-l);
  transition:
    background-color 0.15s,
    opacity 0.15s;
}
.opt-inner {
  width: 100%;
  min-height: inherit;
  padding: 12px 16px 12px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
button.opt:hover:not(:disabled) {
  background: var(--bg-secondary);
}
button.opt:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: -2px;
}
.opt.disabled {
  opacity: 0.4;
  pointer-events: none;
}
.opt-lead {
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.opt-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.opt-label {
  font-size: 16px;
  font-weight: 500;
  line-height: 1.25;
  color: var(--text-gray);
  overflow-wrap: anywhere;
  transition: color 0.15s;
}
button.opt:hover .opt-label,
.opt.selected .opt-label {
  color: var(--text-primary);
}
.opt-sub {
  font-size: 12px;
  font-weight: 400;
  line-height: 1.25;
  color: var(--text-secondary);
}
.opt-trail {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2em;
  color: var(--text-primary);
}
.opt-num {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 500;
  color: var(--text-gray);
  background: var(--bg-secondary);
  border: 1px solid var(--bg-secondary-hover);
  border-radius: var(--br-s);
}
.opt input {
  flex: 1;
  min-width: 0;
  width: 100%;
  font: inherit;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.25;
  color: var(--text-primary);
  background: transparent;
  border: none;
  outline: none;
}
.opt input.is-number {
  font-family: Manrope, sans-serif;
  font-weight: 600;
  line-height: 1.4;
}
.opt input::placeholder {
  color: var(--text-secondary);
}
.check-mark.l {
  width: 24px;
  height: 24px;
}
.check-mark.l::after {
  width: 5px;
  height: 11px;
  border-width: 0 2px 2px 0;
}
.check-mark.on {
  background: var(--primary);
  border-color: var(--primary);
}
.check-mark.on::after {
  opacity: 1;
  transform: translate(-50%, -50%) rotate(45deg) scale(1);
}
.options {
  display: grid;
}
.options-view {
  grid-area: 1 / 1;
  max-height: calc(var(--chat-option-height) * 3.5);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  scroll-padding-bottom: 56px;
}
.options-view.masked {
  mask-image: linear-gradient(to bottom, black calc(100% - 56px), transparent);
}
.options-more {
  grid-area: 1 / 1;
  place-self: end center;
  margin-bottom: 8px;
}
.options-more svg {
  font-size: 18px;
}
.suggest-list {
  width: 100%;
  height: calc(var(--chat-option-height) * 3);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.suggest-state {
  width: 100%;
  height: calc(var(--chat-option-height) * 3);
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.suggest-hint {
  max-width: 280px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
  text-align: center;
  color: var(--text-secondary);
}
.suggest-avatar {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  color: var(--primary);
  text-transform: uppercase;
  background: var(--light-primary-radial-gradient);
  border-radius: 50%;
}
.rules {
  display: grid;
  gap: 8px;
  list-style: none;
}
.rule {
  padding: 12px 12px 12px 14px;
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 10px;
  background: var(--bg-secondary);
  border-radius: var(--br-m);
}
.rule.fresh {
  animation: fresh 1400ms ease-out;
}
@keyframes fresh {
  0%,
  45% {
    box-shadow: 0 0 0 2px var(--primary-soft);
  }
  100% {
    box-shadow: 0 0 0 2px transparent;
  }
}
.rule-text {
  min-width: 0;
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.rule-source {
  display: block;
  margin-top: 2px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-gray);
}
.rule.off .rule-text {
  color: var(--text-gray);
}
.rule-del {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  font-size: 16px;
  color: var(--text-gray);
  background: none;
  border: 0;
  border-radius: var(--br-s);
  transition:
    color 150ms ease-out,
    background-color 150ms ease-out;
}
.rule-del:hover {
  color: var(--error);
  background: var(--bg-error-light);
}
.rule-del:focus-visible {
  outline: 2px solid var(--primary);
}
.rules-empty {
  padding: 12px 14px;
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--text-gray);
  background: var(--bg-secondary);
  border-radius: var(--br-m);
}
.rule-add {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
}
.done {
  height: var(--db-page-height);
  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  text-align: center;
}
.done img {
  width: 400px;
  max-width: 100%;
  height: auto;
}
.done h2 {
  font-size: 24px;
  font-weight: 500;
}
.done p {
  margin-top: 8px;
  font-family: Manrope, sans-serif;
  font-weight: 500;
  color: var(--text-gray);
}
.opt-label-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.textbox.is-disabled {
  opacity: 0.5;
  pointer-events: none;
}
.schedule {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.schedule-time {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}
.time-field {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  color: var(--text-primary);
}
.time-field input {
  width: 124px;
  padding: 10px 14px;
  font-family: Manrope, sans-serif;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
  color: var(--text-primary);
  background: var(--bg-secondary);
  border: 1px solid transparent;
  border-radius: var(--br-m);
  outline: none;
}
.time-field input:focus-visible {
  border-color: var(--primary);
}
.time-field input::placeholder {
  color: var(--text-secondary);
}
.time-field input.invalid {
  border-color: var(--error);
}
.schedule-weekends {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 500;
  user-select: none;
}
.schedule-weekends > label[for] {
  cursor: pointer;
}
.schedule-actions {
  display: flex;
  gap: 8px;
}
.schedule-actions .btn.icon svg {
  font-size: 20px;
}
.letter-text {
  font-family: Manrope, sans-serif;
  font-weight: 500;
  line-height: 1.5;
  white-space: pre-wrap;
}
.tour {
  position: absolute;
  inset: 0;
  z-index: 120;
}
.tour-spot {
  position: absolute;
  border-radius: 20px;
  box-shadow: 0 0 0 10000px rgb(9, 12, 23, 0.375);
  pointer-events: none;
}
.tour-tip {
  position: absolute;
  width: max-content;
  min-width: min(325px, calc(100% - 16px));
  max-width: min(465px, calc(100% - 16px));
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  color: var(--text-primary);
  background: var(--bg-secondary);
  border-radius: 20px;
  animation: tour-in 220ms var(--ease-out);
}
@keyframes tour-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}
.tour-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tour-count {
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 700;
}
.tour-close {
  padding: 2px 5px;
  display: grid;
  place-items: center;
  font-size: 18px;
  color: var(--text-primary);
  background: none;
  border: none;
  transition: opacity 150ms ease-out;
}
.tour-close:hover {
  opacity: 0.75;
}
.tour-text {
  display: grid;
  gap: 8px;
}
.app-root .tour-text h4 {
  font-size: 24px;
  font-weight: 600;
}
.tour-text p {
  font-family: Manrope, sans-serif;
  font-size: 16px;
  line-height: 1.3;
}
.tour-foot {
  display: flex;
  justify-content: flex-end;
  gap: 4px;
}
.tour-next {
  padding: 9px 16px;
  font-family: Manrope, sans-serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--text-on-dark-primary);
  background: var(--primary);
  border: 1px solid var(--primary);
  border-radius: 12px;
  transition: opacity 150ms ease-out;
}
.tour-next:active {
  opacity: 0.75;
}
.tour-next:focus-visible,
.tour-close:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.modal-text {
  font-family: Manrope, sans-serif;
  font-weight: 500;
  line-height: 1.5;
  color: var(--text-gray);
}
.chip {
  flex-shrink: 0;
  height: 36px;
  padding: 0 14px;
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dark-gray);
  white-space: nowrap;
  background: var(--text-on-dark-primary);
  border: 1px solid var(--bg-secondary-hover);
  border-radius: 999px;
  transition:
    background-color 150ms ease-out,
    border-color 150ms ease-out,
    color 150ms ease-out,
    transform 160ms var(--ease-out);
}
.chip:hover {
  color: var(--primary);
  border-color: var(--primary-pale);
}
.chip:active {
  transform: scale(0.97);
}
.chip:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.chip.on {
  color: var(--primary);
  background: var(--bg-primary-light);
  border-color: transparent;
}
.reasons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.reasons .chip {
  height: auto;
  min-height: 36px;
  padding: 6px 14px;
  white-space: normal;
  text-align: left;
}
.sheet-label {
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-gray);
}
.proposal {
  padding: 14px;
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: start;
  gap: 12px;
  background: var(--bg-secondary);
  border-radius: var(--br-l);
}
.proposal-kind {
  display: block;
  margin-bottom: 4px;
  font-family: Manrope, sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-gray);
}
.proposal-text {
  font-size: 16px;
  font-weight: 500;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.proposal textarea {
  width: 100%;
  padding: 8px 10px;
  margin: -8px -10px;
  width: calc(100% + 20px);
  font: inherit;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--text-primary);
  background: var(--text-on-dark-primary);
  border: 1px solid var(--primary-pale);
  border-radius: var(--br-s);
  outline: none;
  resize: none;
}
.proposal-effect {
  margin-top: 8px;
  font-family: Manrope, sans-serif;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--text-gray);
}
.generating {
  min-height: 120px;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 10px;
  font-size: 16px;
}
.generating .ai-spinner {
  font-size: 28px;
}
@container app (max-width: 1024px) {
  .tour-tip {
    min-width: min(275px, calc(100% - 16px));
    padding: 16px;
  }
  .app-root .tour-text h4 {
    font-size: 20px;
  }
  .tour-text p,
  .tour-next {
    font-size: 14px;
  }
}
@container app (max-width: 991px) {
  .flow {
    gap: 12px;
  }
  .page-header h2 {
    font-size: 18px;
  }
  .mode {
    width: 280px;
  }
  .chat-messages {
    padding: 8px 12px 16px;
    gap: 12px;
  }
  .bubble-lead {
    font-size: 16px;
  }
  .ptable-row {
    padding: 12px;
    gap: 6px 12px;
  }
  .ptable-label,
  .ptable-value,
  .ptable-rules li {
    font-size: 14px;
  }
  .ptable-value .badge {
    min-height: 22px;
    padding-block: 2px;
    font-size: 12px;
  }
  .diag-row {
    padding: 12px 16px;
    font-size: 14px;
  }
  .textbox {
    min-height: 84px;
  }
  .textbox textarea {
    padding: 14px 56px 14px 14px;
    font-size: 14px;
  }
  .textbox.has-skip textarea {
    padding-right: 132px;
  }
  .answer {
    border-radius: var(--br-xl);
  }
  .answer-head {
    min-height: 56px;
    padding: 12px 16px 4px;
    gap: 12px;
  }
  .answer-head:has(.answer-action:not(:empty)) {
    grid-template-columns: 1fr minmax(106px, auto);
    padding-right: 8px;
  }
  .answer-title {
    font-size: 16px;
  }
  .answer-body {
    padding: 0 6px 6px;
  }
  .opt-inner {
    padding: 8px 12px 8px 8px;
  }
  .opt-label,
  .opt input {
    font-size: 14px;
  }
  .opt-num {
    width: 28px;
    height: 28px;
    font-size: 14px;
  }
  .check-mark.l {
    width: 20px;
    height: 20px;
  }
  .check-mark.l::after {
    width: 4px;
    height: 7px;
    border-width: 0 0.15em 0.15em 0;
  }
  .done img {
    width: 280px;
  }
  .done h2 {
    font-size: 20px;
  }
  .modal-header h3 {
    font-size: 20px;
  }
}
@container app (max-width: 560px) {
  .page-header {
    grid-template-columns: auto minmax(0, 1fr);
    gap: 8px;
  }
  .page-header h2,
  .page-header .backlink span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .page-header .backlink {
    width: 48px;
    height: 48px;
    padding: 0;
    justify-content: center;
    border-radius: var(--br-l);
  }
  .page-header .mode {
    width: 100%;
    padding: 4px;
  }
  .mode .btn svg {
    font-size: 16px;
  }
  .msg-content {
    max-width: 95%;
  }
  .bubble {
    padding: 8px 12px;
    line-height: 1.4;
  }
  .chat-messages {
    padding: 4px 0 12px;
  }
  .answer-head {
    gap: 8px;
  }
  .opt-inner {
    gap: 8px;
  }
  .opt-trail {
    font-size: 1.25em;
  }
  .summary-actions .btn {
    flex: 1 1 auto;
  }
  .time-field input {
    width: 86px;
    padding: 10px 12px;
    font-size: 14px;
  }
  .letter-text {
    line-height: 1.4;
  }
  .app-root .tour-text h4 {
    font-size: 18px;
  }
  .tour-next {
    flex: 1;
  }
  .done {
    padding: 0;
  }
  .done img {
    width: 240px;
  }
  .done h2 {
    font-size: 18px;
  }
  .modal {
    inset: auto 0 0;
    width: 100%;
    max-width: 100%;
    padding: 1em;
    border-radius: var(--br-xl) var(--br-xl) 0 0;
    transform: none;
    animation: sheet-in 250ms ease-out;
  }
  .modal-header h3 {
    font-size: 16px;
  }
  .modal-actions {
    grid-auto-flow: row;
  }
  .modal-actions.confirm .btn.light {
    order: -1;
  }
  .toasts {
    right: 8px;
    bottom: calc(var(--db-bottom-bar-inset) + 8px);
    left: 8px;
    width: auto;
    max-width: none;
  }
}
@container app (max-width: 420px) {
  .answer-head {
    min-height: 52px;
    padding: 8px 16px 4px;
  }
  .answer-head:has(.answer-action:not(:empty)) {
    grid-template-columns: 1fr minmax(98px, auto);
  }
  .answer-title {
    font-size: 14px;
  }
  .answer-action .btn,
  .textbox .btn {
    height: 32px;
    padding: 0 12px;
    font-size: 0.875em;
  }
  .answer-action .btn.icon,
  .textbox .btn.icon {
    padding: 0;
  }
  .textbox.has-skip textarea {
    padding-right: 116px;
  }
}
@keyframes sheet-in {
  from {
    transform: translateY(100%);
  }
}
.manual {
  min-height: 0;
  padding-right: 4px;
  overflow: hidden auto;
  scrollbar-width: thin;
  scrollbar-color: var(--bg-tertiary) transparent;
}
.form-card {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 2em;
  background: var(--text-on-dark-primary);
  border-radius: var(--br-xl);
  box-shadow: var(--db-section-shadow);
}
.form-row {
  display: grid;
  grid-template-columns: 0.75fr 1fr;
  align-items: flex-start;
  gap: 1em;
}
.form-left {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
}
.form-label {
  font-family: Manrope, sans-serif;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.15;
}
.form-hint {
  font-family: Manrope, sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  text-wrap: balance;
}
.form-control {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.5em;
}
.form-control textarea.input {
  height: auto;
  padding: 1em;
  line-height: 1.4;
  resize: none;
}
.select-trigger {
  width: 100%;
  height: var(--input-height);
  padding: 0 0.75em 0 1em;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 8px;
  font-family: Manrope, sans-serif;
  font-size: 1em;
  font-weight: 600;
  text-align: left;
  color: var(--text-primary);
  background: var(--bg-secondary);
  border: 0;
  border-radius: var(--br-m);
}
.select-trigger svg {
  font-size: 22px;
}
.time-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
}
.time-row .input {
  width: 124px;
  text-align: center;
}
.check-row {
  width: 100%;
  padding: 0.665em 1em;
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 0.625em;
  font-family: Manrope, sans-serif;
  font-size: 1em;
  font-weight: 600;
  background: var(--bg-secondary);
  border-radius: var(--br-m);
  cursor: pointer;
  transition: color 150ms ease-out;
}
.check-row:hover {
  color: var(--primary);
}
.check-row input {
  position: absolute;
  width: 0;
  height: 0;
  opacity: 0;
}
.check-row .check-mark {
  background: var(--text-on-dark-primary);
}
.check-row input:checked ~ .check-mark {
  background: var(--primary);
  border-color: var(--primary);
}
.check-row input:checked ~ .check-mark::after {
  opacity: 1;
  transform: translate(-50%, -50%) rotate(45deg) scale(1);
}
.check-row input:focus-visible ~ .check-mark {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tag {
  height: 34px;
  padding: 0 0.5em 0 1em;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--primary);
  background: var(--bg-primary-light);
  border-radius: 50px;
}
.tag button {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  font-size: 16px;
  color: var(--primary);
  background: none;
  border: 0;
  border-radius: 50%;
}
.tag button:hover {
  background: var(--bg-primary-light-hover);
}
.suffix {
  position: relative;
}
.suffix span {
  position: absolute;
  right: 16px;
  top: 50%;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  transform: translateY(-50%);
  pointer-events: none;
}
.inline-link {
  align-self: flex-start;
  padding: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: Manrope, sans-serif;
  font-size: 1em;
  font-weight: 600;
  color: var(--primary);
  background: none;
  border: 0;
}
.inline-link:hover {
  color: var(--primary-hover);
}
.segmented {
  padding: 4px;
  display: flex;
  gap: 4px;
  background: var(--bg-secondary);
  border-radius: 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.segmented .btn {
  flex: 1;
}
.segmented .btn.plain {
  background: none;
  color: var(--text-primary);
}
.letter-card {
  padding: 1em;
  display: grid;
  gap: 12px;
  background: var(--bg-secondary);
  border-radius: var(--br-m);
}
.letter-card h5 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
}
.letter-card h5 svg {
  font-size: 18px;
  color: var(--primary);
}
.letter-card hr {
  height: 1px;
  background: var(--border-primary);
  border: 0;
}
.letter-card li {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 600;
  list-style: none;
}
.letter-card ul {
  display: grid;
  gap: 8px;
}
.letter-card li svg {
  font-size: 18px;
  color: var(--primary);
}
.submit-bar {
  padding: 10px 10px 10px 20px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 8px;
  background: var(--text-on-dark-primary);
  border-radius: var(--br-xl);
  box-shadow: var(--db-section-shadow);
}
.submit-count {
  min-width: 0;
  display: grid;
  font-family: Manrope, sans-serif;
  font-size: 16px;
  font-weight: 600;
}
.submit-count b {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--primary);
}
.submit-count small {
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--text-gray);
}
.submit-bar .btn.whitePrimary {
  border: 1px solid var(--bg-tertiary);
}
.submit-bar .btn.whitePrimary svg {
  font-size: 1.2em;
}
.submit-bar .btn.l {
  min-width: 184px;
}
.blocking {
  height: var(--db-page-height);
  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  text-align: center;
}
.blocking img {
  width: 320px;
  max-width: 100%;
  height: auto;
}
.blocking h2 {
  font-size: 24px;
  font-weight: 500;
}
.blocking p {
  max-width: 464px;
  margin-top: 8px;
  font-family: Manrope, sans-serif;
  font-weight: 500;
  line-height: 1.5;
  color: var(--text-gray);
}
.blocking-actions {
  width: 100%;
  max-width: 320px;
  display: grid;
  gap: 8px;
}
.info-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.info-card {
  padding: 16px;
  display: grid;
  gap: 6px;
  background: var(--bg-secondary);
  border-radius: 16px;
}
.info-card small,
.info-caption {
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
}
.info-caption {
  margin-left: 16px;
  margin-bottom: -8px;
}
.info-card b {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 16px;
  font-weight: 500;
}
.info-card svg {
  color: var(--primary);
}
.params {
  background: var(--bg-secondary);
  border-radius: 16px;
}
.params-row {
  padding: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 8px;
  font-size: 16px;
}
.params-row + .params-row {
  border-top: 1px solid var(--bg-tertiary);
}
.params-key {
  font-weight: 500;
  color: var(--text-gray);
}
.params-val {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
  font-weight: 600;
  text-align: right;
}
.preview-list {
  max-height: 52cqh;
  min-height: 0;
  padding-right: 4px;
  display: grid;
  gap: 12px;
  overflow: hidden auto;
}
.preview-card {
  padding: 16px;
  display: grid;
  gap: 10px;
  background: var(--bg-secondary);
  border-radius: 16px;
}
.preview-card .click-title {
  white-space: normal;
}
.preview-why {
  padding-top: 10px;
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.25;
  color: var(--text-gray);
  border-top: 1px solid var(--bg-tertiary);
}
@container app (max-width: 991px) {
  .form-card {
    padding: 16px;
    gap: 1.5em;
  }
  .submit-bar {
    padding: 8px 8px 8px 16px;
  }
  .submit-bar .btn.l {
    min-width: 140px;
  }
  .form-label {
    font-size: 16px;
  }
  .tag {
    height: 28px;
    font-size: 12px;
  }
  .blocking {
    gap: 24px;
  }
  .blocking h2 {
    font-size: 20px;
  }
  .params-row {
    grid-template-columns: 1fr;
    font-size: 14px;
  }
  .params-val {
    justify-content: flex-start;
    text-align: left;
  }
  .info-card small {
    font-size: 12px;
  }
  .info-card b {
    font-size: 14px;
  }
}
@container app (max-width: 768px) {
  .form-row {
    grid-template-columns: 1fr;
    gap: 0.75em;
  }
}
@container app (max-width: 560px) {
  .form-card {
    padding: 14px;
  }
  .submit-bar {
    padding: 10px;
    grid-template-columns: auto minmax(0, 1fr);
  }
  .submit-count {
    grid-column: 1 / -1;
    padding: 0 4px;
    font-size: 14px;
  }
  .submit-bar .btn.l {
    min-width: 0;
  }
  .manual {
    padding-right: 0;
  }
  .time-row {
    display: grid;
    grid-template-columns: auto 1fr auto 1fr;
  }
  .time-row .input {
    width: 100%;
    padding: 0 12px;
  }
  .time-row .btn {
    grid-column: 1 / -1;
  }
  .blocking {
    padding: 0;
  }
  .blocking h2 {
    font-size: 18px;
  }
  .blocking p {
    font-size: 14px;
  }
  .info-cards {
    grid-template-columns: 1fr;
  }
}
.stepper {
  display: inline-grid;
  grid-auto-flow: column;
  align-items: center;
  gap: 6px;
}
.stepper span {
  width: 36px;
  height: 6px;
  background: var(--bg-tertiary);
  border-radius: 256px;
  transition: background 300ms ease;
}
.stepper span.on {
  background: var(--primary);
}
.rscreen {
  width: 100%;
  height: var(--db-page-height);
  padding: 1em 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: safe center;
  overflow-y: auto;
}
.rscreen-content {
  width: 596px;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.rscreen-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.25em;
  text-align: center;
}
.rscreen-head .stepper {
  margin-bottom: 16px;
}
.rscreen-head h2 {
  font-size: 32px;
  font-weight: 600;
}
.rscreen-head p {
  font-family: Manrope, sans-serif;
  font-size: 18px;
  font-weight: 500;
  color: var(--text-secondary);
}
.rscreen-mode {
  align-self: center;
}
.rlist {
  display: grid;
  gap: 8px;
}
.rcard {
  width: 100%;
  padding: 24px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 24px;
  background: var(--text-on-dark-primary);
  border-radius: var(--br-xl);
  cursor: pointer;
  transition: box-shadow 0.15s;
}
.rcard.checked {
  box-shadow: inset 0 0 0 2px var(--primary);
  cursor: default;
}
.rcard.disabled {
  cursor: default;
}
.rcard.disabled .rcard-main,
.rcard.disabled .radio {
  opacity: 0.5;
}
.rcard:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.rcard-main {
  min-width: 0;
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 16px;
}
.ravatar {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  font-size: 22px;
  color: var(--primary);
  background: var(--bg-primary-light);
  border-radius: var(--br-m);
}
.rcard-info {
  min-width: 0;
  display: grid;
  gap: 4px;
}
.rcard-info h4 {
  font-size: 18px;
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
}
.rcard-info span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: Manrope, sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-gray);
}
.rcard-info span.is-warn {
  color: var(--warning);
}
.rcard-info span svg {
  font-size: 16px;
}
.radio {
  position: relative;
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  background: var(--bg-secondary);
  border: 1px solid var(--bg-secondary-hover);
  border-radius: 50%;
  transition:
    background-color 150ms ease-out,
    border-color 150ms ease-out;
}
.radio.on {
  background: var(--primary);
  border-color: var(--primary);
}
.radio.on::after {
  content: '';
  position: absolute;
  inset: 6px;
  background: var(--text-on-dark-primary);
  border-radius: 50%;
}
.rscreen-actions {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px;
}
.floader {
  height: var(--db-page-height);
  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
}
.floader-spin .ai-spinner {
  width: 56px;
  height: 56px;
}
.floader h2 {
  margin-top: 12px;
  font-size: 24px;
  font-weight: 600;
}
.floader p {
  font-family: Manrope, sans-serif;
  font-weight: 500;
  color: var(--text-gray);
}
.flow.is-wizard {
  grid-template-rows: auto 1fr auto;
  gap: 12px;
}
.page-header.no-back {
  grid-template-columns: minmax(0, 1fr) auto;
}
.wiz {
  min-height: 0;
  padding-right: 4px;
  overflow: hidden auto;
  scrollbar-width: thin;
  scrollbar-color: var(--bg-tertiary) transparent;
}
.wiz-col {
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
  padding-bottom: 8px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.wiz-head {
  padding: 8px 4px 4px;
  display: grid;
  gap: 8px;
}
.wiz-head .stepper {
  margin-bottom: 8px;
  justify-self: start;
}
.wiz-head h2 {
  font-size: 28px;
  font-weight: 600;
  text-wrap-style: balance;
}
.wiz-head p {
  max-width: 62ch;
  font-family: Manrope, sans-serif;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.45;
  color: var(--text-gray);
}
.wiz-note {
